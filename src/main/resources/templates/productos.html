<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"> <head>
  <meta charset="UTF-8">
  <title>Gestión de Productos - Kinal App</title>
  <link rel="stylesheet" th:href="@{/css/productos.css}">
</head>
<body>
<div class="container">
  <header>
    <h1>Gestión de Productos</h1>
    <a th:href="@{/menu}" class="btn-back">Volver al Menú</a>
  </header>

  <section class="form-container">
    <form th:action="@{/productos/guardar}" method="post" class="glass-form">
      <input type="number" name="codigoProducto" placeholder="Código (ID)" required>
      <input type="text" name="nombreProducto" placeholder="Nombre del Producto" required style="flex: 2;">
      <input type="number" step="0.01" name="precio" placeholder="Precio (10.50)" required>
      <input type="number" name="stock" placeholder="Stock" required>

      <button type="submit" class="btn-save">Guardar Producto</button>
    </form>
  </section>

  <section class="table-container">
    <table class="glass-table">
      <thead>
      <tr>
        <th>CÓDIGO</th>
        <th>NOMBRE</th>
        <th>PRECIO</th>
        <th>STOCK</th>
        <th>ACCIONES</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="p : ${productos}">
        <td th:text="${p.codigoProducto}">123</td>
        <td th:text="${p.nombreProducto}">Azucar</td>
        <td th:text="'Q' + ${p.precio}">Q123.01</td>
        <td th:text="${p.stock}">123</td>
        <td class="actions-cell">

          <a sec:authorize="hasRole('ADMIN')"
             th:href="@{/productos/editar/{id}(id=${p.codigoProducto})}"
             class="btn-edit">Editar</a>

          <a sec:authorize="hasRole('ADMIN')"
             th:href="@{/productos/eliminar/{id}(id=${p.codigoProducto})}"
             class="btn-delete"
             onclick="return confirm('¿Seguro que quieres eliminar este producto?')">
            Eliminar
          </a>

        </td>
      </tr>
      </tbody>
    </table>
  </section>
</div>
</body>
</html>
