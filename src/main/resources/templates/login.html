<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="login-page">

<div class="login-card">
    <div class="login-header">
        <h2>Iniciar Sesion</h2>
        <p>Ingresa tus credenciales para continuar</p>
    </div>

    <form th:action="@{/login}" method="post" class="login-form">

        <div th:if="${param.error}" class="alert-error">
            Usuario o contraseña incorrectos.
        </div>

        <div th:if="${param.logout}" class="alert-info">
            Has cerrado sesión correctamente.
        </div>

        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" placeholder="Ej: admin" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-login">Acceder al Sistema</button>
    </form>

        <div class="form-group">
            <p>¿No tienes cuenta? <a th:href="@{/registrar}">Regístrate aquí</a></p>
        </div>

    <div class="login-footer">
        <p>&copy; Diego Sebastian De Leon Barrios - 2021322 - IN5AVl</p>
    </div>
</div>

</body>
</html>
