<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema KinalApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="InicioDeSesion">
    <div class="EncabezadoIS">Iniciar Sesión</div>

    <div th:if="${param.error != null}" class="alertaCustomizada">
        ❌ Datos incorrectos (admin / kinal123)
    </div>

    <form th:action="@{/login}" method="post">
        <input type="text" name="user" class="form-control form-control-custom"
               placeholder="Ingrese su usuario" required>

        <input type="password" name="pass" class="form-control form-control-custom"
               placeholder="Ingrese Contraseña" required>

        <div class="remember-me-container">
            <div class="custom-checkbox">X</div>
            <span>Remember Me</span>
        </div>

        <button type="submit" class="btn-send">Send</button>
    </form>
</div>

<div class="reflection-container">
    <div class="reflection-card"></div>
</div>

</body>
</html>
