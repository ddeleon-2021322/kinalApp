<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register | Kinal App</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="login-page">

<div class="login-card">
    <div class="login-header">
        <h2>Kinal<span>Register</span></h2>
        <p>Crea una cuenta para acceder al panel de gestión</p>
    </div>

    <form th:action="@{/register}" th:object="${usuario}" method="post" class="login-form">

        <div class="form-group">
            <label for="userName">Nombre de Usuario</label>
            <input type="text" id="userName" th:field="*{userName}" placeholder="Ingrese su nombre" required autofocus>
        </div>

        <div class="form-group">
            <label for="email">Correo Electronico</label>
            <input type="text" id="email" th:field="*{email}" placeholder="Ingrese su correo" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" th:field="*{password}" placeholder="*******" required>
        </div>

        <button type="submit" class="btn-login">Finalizar Register</button>
    </form>

    <div class="form-group">
        <p>¿Ya tienes cuenta? <a th:href="@{/login}">Regresar al Login</a></p>
    </div>

    <div class="login-footer">
        <p>&copy; Diego Sebastian De Leon Barrios - 2021322 - IN5AV</p>
    </div>
</div>

</body>
</html>
