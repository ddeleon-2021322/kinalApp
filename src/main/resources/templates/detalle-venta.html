<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión Detalle Venta - Kinal App</title>
    <link rel="stylesheet" th:href="@{/css/productos.css}">
</head>
<body>
<div class="container">
    <header>
        <div class="header-content">
            <h1>Gestión Detalle Venta</h1>
            <a th:href="@{/menu}" class="btn-back">Volver al Menú</a>
        </div>
    </header>

    <section class="form-container">
        <form th:action="@{/detalles-ventas/guardar}" method="post" class="glass-form">

            <select name="venta.codigoVenta" class="custom-select" required>
                <option value="" disabled selected>Seleccionar Venta (ID)</option>
                <option th:each="v : ${ventas}"
                        th:value="${v.codigoVenta}"
                        th:text="'Venta #' + ${v.codigoVenta}"></option>
            </select>

            <select name="producto.codigoProducto" class="custom-select" required>
                <option value="" disabled selected>Seleccionar Producto</option>
                <option th:each="p : ${productos}"
                        th:value="${p.codigoProducto}"
                        th:text="${p.nombreProducto}"></option>
            </select>

            <input type="number" name="cantidad" placeholder="Cantidad" min="1" required>
            <input type="number" step="0.01" name="precioUnitario" placeholder="Precio Unitario Q" required>

            <button type="submit" class="btn-save">Registrar Detalle</button>
        </form>
    </section>

    <section class="table-container">
        <table class="glass-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>VENTA</th>
                <th>PRODUCTO</th>
                <th>CANTIDAD</th>
                <th>PRECIO UNIT.</th>
                <th>SUBTOTAL</th>
                <th>ACCIONES</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="d : ${detalles}">
                <td th:text="${d.codigoDetalleVenta}"></td>
                <td th:text="'#' + ${d.venta?.codigoVenta}"></td>
                <td th:text="${d.producto?.nombreProducto}"></td>
                <td th:text="${d.cantidad}"></td>
                <td th:text="'Q' + ${d.precioUnitario}"></td>
                <td th:text="'Q' + ${d.subtotal}"></td>

                <td class="actions-cell">
                    <a th:href="@{/detalles-ventas/editar/{id}(id=${d.codigoDetalleVenta})}" class="btn-edit">
                        Editar
                    </a>

                    <a th:href="@{/detalles-ventas/eliminar/{id}(id=${d.codigoDetalleVenta})}"
                       onclick="return confirm('¿Eliminar detalle?')">
                        Eliminar
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</div>
</body>
</html>
