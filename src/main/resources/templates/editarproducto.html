<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto - Kinal App</title>
    <link rel="stylesheet" th:href="@{/css/productos.css}">
</head>
<body>
<div class="container">
    <header>
        <h1>Editar Producto</h1>
        <a th:href="@{/productos/gestion}" class="btn-back">Cancelar y Volver</a>
    </header>

    <section class="form-container">
        <form th:action="@{/productos/guardar}" method="post" class="glass-form" style="display: flex; flex-direction: column; gap: 20px;">

            <div style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label style="font-size: 0.85rem; color: #555; font-weight: 600;">Código ID</label>
                    <input type="number" name="codigoProducto" th:value="${producto.codigoProducto}" readonly
                           style="background-color: #f0f0f0; cursor: not-allowed;">
                </div>

                <div style="flex: 2;">
                    <label style="font-size: 0.85rem; color: #555; font-weight: 600;">Nombre del Producto</label>
                    <input type="text" name="nombreProducto" th:value="${producto.nombreProducto}" required>
                </div>
            </div>

            <div style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label style="font-size: 0.85rem; color: #555; font-weight: 600;">Precio (Q)</label>
                    <input type="number" step="0.01" name="precio" th:value="${producto.precio}" required>
                </div>

                <div style="flex: 1;">
                    <label style="font-size: 0.85rem; color: #555; font-weight: 600;">Stock disponible</label>
                    <input type="number" name="stock" th:value="${producto.stock}" required>
                </div>
            </div>

            <button type="submit" class="btn-save" style="width: 200px; align-self: flex-end;">Guardar Cambios</button>
        </form>
    </section>
</div>
</body>
</html>
